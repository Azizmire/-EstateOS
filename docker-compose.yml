services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: estateos
      POSTGRES_USER: estateos
      POSTGRES_PASSWORD: estateos-local
    ports:
      - "5432:5432"
    volumes:
      - estateos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estateos -d estateos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  estateos_postgres:
