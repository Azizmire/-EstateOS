name: CI

on:
  push:
    branches: ['main', 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estateos_test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estateos_test
          JWT_SECRET: estateos-ci-secret-that-is-at-least-32-characters-long
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estateos_test
          JWT_SECRET: estateos-ci-secret-that-is-at-least-32-characters-long
